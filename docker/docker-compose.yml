# Production-shaped stack:  nginx -> api (x1..n) -> postgres / redis <- arq worker (x1..n)
#
#   docker compose -f docker/docker-compose.yml up --build
#   open http://localhost:8080/docs
#
# Scale workers independently of the API:
#   docker compose -f docker/docker-compose.yml up --scale worker=3
#
# NOTE: api and worker share the `storage` volume (local-disk storage). To run them on
# different hosts, implement the S3 storage backend (see README "Future scope").

name: geo-measure

x-app: &app
  build:
    context: ..
    dockerfile: docker/Dockerfile
  environment: &env
    DATABASE_URL: postgresql+asyncpg://geo:geo@db:5432/geo
    REDIS_URL: redis://redis:6379/0
    PROCESSING_MODE: worker
    STORAGE_DIR: /data/storage
    AUTO_CREATE_TABLES: "false" # schema is managed by `alembic upgrade head` (migrate service)
    FORWARDED_ALLOW_IPS: "*" # trust X-Forwarded-For from nginx so per-client limits see real IPs
    LOG_JSON: "true"
  volumes:
    - storage:/data
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: geo
      POSTGRES_PASSWORD: geo
      POSTGRES_DB: geo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geo -d geo"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    expose:
      - "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    <<: *app
    command: ["arq", "app.workers.settings.WorkerSettings"]
    healthcheck:
      test: ["CMD", "arq", "--check", "app.workers.settings.WorkerSettings"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

volumes:
  storage:
  pgdata:
