# Edge protection for the upload endpoint. The application enforces the exact size caps
# itself; nginx exists so floods never reach Python and uploads are not buffered to disk twice.

worker_processes auto;
events { worker_connections 1024; }

http {
  # Only POSTs are rate limited: an empty key is never counted by limit_req.
  map $request_method $upload_key {
    POST    $binary_remote_addr;
    default "";
  }
  limit_req_zone $upload_key          zone=uploads:10m rate=30r/m;
  limit_req_zone $binary_remote_addr  zone=general:10m rate=20r/s;
  limit_req_status 429;

  upstream api { server api:8000; keepalive 16; }

  server {
    listen 80;

    # A little above the app's MAX_UPLOAD_BYTES (100 MiB) so the app returns the friendly
    # problem+json 413 for files just over the limit.
    client_max_body_size 101m;
    client_body_timeout 60s;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;

    location = /api/files/ {
      limit_req zone=uploads burst=10 nodelay;
      limit_req zone=general burst=40 nodelay;
      proxy_request_buffering off;   # stream the body to the app; its byte counter cuts it off at the cap
      proxy_pass http://api;
    }

    location / {
      limit_req zone=general burst=40 nodelay;
      proxy_pass http://api;
    }
  }
}
